
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة أبجد هوز - حساب الجمل</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  min-height: 100vh;
  font-family: Tahoma, Arial, sans-serif;
  background: linear-gradient(135deg, #102b23, #24503c, #0b1c18);
  color: #173b2d;
}

.container {
  max-width: 850px;
  margin: 20px auto;
  padding: 25px;
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 10px 35px #0004;
}

header {
  text-align: center;
  margin-bottom: 25px;
}

header h1 {
  color: #a47b28;
  font-size: 29px;
}

header p {
  line-height: 1.9;
  color: #526459;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 22px;
}

button {
  font-family: inherit;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  padding: 13px;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  opacity: 0.88;
}

.tabs button {
  flex: 1;
  background: #e8eee9;
  color: #173b2d;
}

.tabs button.active {
  background: #173b2d;
  color: white;
}

label {
  display: block;
  margin-bottom: 8px;
}

textarea,
input {
  width: 100%;
  padding: 15px;
  margin: 8px 0 12px;
  border: 2px solid #d6dfd8;
  border-radius: 10px;
  font-family: inherit;
  font-size: 18px;
  outline-color: #a47b28;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

.main-btn {
  width: 100%;
  background: #a47b28;
  color: white;
  font-weight: bold;
  margin: 5px 0;
}

.secondary-btn {
  background: #173b2d;
  color: white;
  margin: 5px 0;
}

.reset-btn {
  width: 100%;
  background: #a83232;
  color: white;
  margin: 5px 0;
}

.result {
  margin-top: 20px;
  padding: 18px;
  background: #f2f6f2;
  border-radius: 12px;
  overflow-wrap: anywhere;
}

.result h3 {
  color: #a47b28;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin: 12px 0;
  background: white;
}

th,
td {
  border: 1px solid #dce4dd;
  padding: 11px 7px;
  text-align: center;
  overflow-wrap: anywhere;
}

th {
  background: #173b2d;
  color: white;
}

.total {
  margin: 15px 0;
  padding: 16px;
  text-align: center;
  font-size: 25px;
  font-weight: bold;
  color: #a47b28;
  background: #fff;
  border-radius: 10px;
}

.highest {
  background: #fff0cc;
  border-radius: 10px;
  padding: 15px;
  margin-top: 12px;
  line-height: 2;
}

.note {
  font-size: 13px;
  color: #64736a;
  line-height: 1.9;
}

.hidden {
  display: none !important;
}

footer {
  text-align: center;
  margin-top: 28px;
  padding-top: 15px;
  border-top: 1px solid #e3e9e4;
  color: #a47b28;
  line-height: 2;
}

@media (max-width: 500px) {
  .container {
    padding: 15px;
  }

  header h1 {
    font-size: 23px;
  }

  .tabs {
    flex-direction: column;
  }

  th, td {
    padding: 8px 4px;
    font-size: 13px;
  }
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>حَاسِبَةُ أَبْجَدْ هَوَّزْ</h1>
  <p>
    حساب الجُمَّل وتحويل الحروف إلى أرقام
    والأرقام إلى حروف
  </p>
</header>

<div class="tabs">
  <button id="tabName" class="active"
    onclick="showTab('name')">
    الاسم إلى أرقام
  </button>

  <button id="tabNumber"
    onclick="showTab('number')">
    الأرقام إلى حروف
  </button>
</div>

<!-- القسم الأول: الأسماء إلى أرقام -->
<section id="nameSection">

  <label for="nameInput">
    <b>اكتب الاسم أو العبارة:</b>
  </label>

  <textarea id="nameInput"
    placeholder="مثال: محمد"></textarea>

  <button class="main-btn" onclick="calculateName()">
    احسب القيم والمجموع
  </button>

  <button class="reset-btn" onclick="resetName()">
    RESET - إعادة ضبط
  </button>

  <div id="nameResult" class="result hidden"></div>

</section>

<!-- القسم الثاني: أرقام متعددة إلى حروف -->
<section id="numberSection" class="hidden">

  <label for="numberInput">
    <b>اكتب رقمًا أو عدة أرقام وافصل بينها بفاصلة:</b>
  </label>

  <textarea id="numberInput"
    placeholder="مثال: 92، 66، 786"></textarea>

  <p class="note">
    يمكنك الفصل بفاصلة عربية أو إنجليزية أو وضع كل رقم في سطر مستقل.
  </p>

  <button class="main-btn" onclick="convertNumber()">
    حوّل الأرقام إلى حروف
  </button>

  <button class="reset-btn" onclick="resetNumbers()">
    RESET - إعادة ضبط
  </button>

  <div id="numberResult" class="result hidden"></div>

</section>

<footer>
  إعداد وبرمجة: وائل دهشان
  <br>
  رِواق الفن العربي
</footer>

</div>

<script>
// جدول حساب الجمل الكبير
const values = {
  "ا":1, "أ":1, "إ":1, "آ":1, "ٱ":1,
  "ب":2, "ج":3, "د":4,
  "ه":5, "ة":5, "و":6, "ز":7, "ح":8, "ط":9,
  "ي":10, "ى":10, "ك":20, "ل":30, "م":40,
  "ن":50, "س":60, "ع":70, "ف":80, "ص":90,
  "ق":100, "ر":200, "ش":300, "ت":400,
  "ث":500, "خ":600, "ذ":700, "ض":800,
  "ظ":900, "غ":1000
};

// ترتيب الحروف من أعلى قيمة إلى أدناها
const letterNames = [
  ["غ",1000], ["ظ",900], ["ض",800],
  ["ذ",700], ["خ",600], ["ث",500],
  ["ت",400], ["ش",300], ["ر",200],
  ["ق",100], ["ص",90], ["ف",80],
  ["ع",70], ["س",60], ["ن",50],
  ["م",40], ["ل",30], ["ك",20],
  ["ي",10], ["ط",9], ["ح",8], ["ز",7],
  ["و",6], ["ه",5], ["د",4], ["ج",3],
  ["ب",2], ["ا",1]
];

function showTab(tab) {
  document.getElementById("nameSection")
    .classList.toggle("hidden", tab !== "name");

  document.getElementById("numberSection")
    .classList.toggle("hidden", tab !== "number");

  document.getElementById("tabName")
    .classList.toggle("active", tab === "name");

  document.getElementById("tabNumber")
    .classList.toggle("active", tab === "number");
}

// تحويل الاسم إلى قيم عددية
function calculateName() {
  const name = document.getElementById("nameInput").value.trim();
  const result = document.getElementById("nameResult");

  if (!name) {
    alert("يرجى كتابة الاسم أولاً.");
    return;
  }

  let total = 0;
  let rows = "";
  let highest = -1;
  let highestLetters = [];
  let unknown = [];

  for (const char of name) {
    // تجاهل المسافات والتشكيل
    if (/\s/.test(char) || /[\u064B-\u065F\u0670]/.test(char)) {
      continue;
    }

    if (Object.prototype.hasOwnProperty.call(values, char)) {
      const value = values[char];
      total += value;

      rows += `
        <tr>
          <td>${escapeHTML(char)}</td>
          <td>${value}</td>
        </tr>
      `;

      if (value > highest) {
        highest = value;
        highestLetters = [char];
      } else if (value === highest) {
        highestLetters.push(char);
      }
    } else {
      unknown.push(char);
    }
  }

  if (highest === -1) {
    alert("لم يتم العثور على حروف معروفة في جدول أبجد.");
    return;
  }

  const uniqueHighest = [...new Set(highestLetters)];

  const warning = unknown.length
    ? `<p class="note">حروف لم تُحسب: ${
        escapeHTML([...new Set(unknown)].join("، "))
      }</p>`
    : "";

  result.innerHTML = `
    <h3>تفصيل حروف الاسم</h3>

    <table>
      <thead>
        <tr><th>الحرف</th><th>القيمة العددية</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>

    <div class="total">
      مجموع الاسم: ${total}
    </div>

    <div class="highest">
      <b>الحرف أو الحروف الأعلى قيمة:</b><br>
      ${uniqueHighest.map(escapeHTML).join("، ")}
      <br>
      <b>القيمة العددية:</b> ${highest}
    </div>

    ${warning}

    <button class="secondary-btn"
      onclick="copyNameResult()">
      نسخ النتيجة
    </button>
  `;

  result.classList.remove("hidden");

  window.lastNameResult =
    `الاسم: ${name}\n` +
    `مجموع الاسم: ${total}\n` +
    `أعلى حرف قيمة: ${uniqueHighest.join("، ")}\n` +
    `قيمة أعلى حرف: ${highest}`;
}

// فصل الأرقام المكتوبة بفواصل أو أسطر جديدة
function splitNumbers(raw) {
  return raw.trim().split(/[,،;؛\s]+/).filter(Boolean);
}

// تحويل رقم واحد إلى حروف أبجد
function numberToLetters(original) {
  let number = original;
  const letters = [];
  const breakdown = [];

  for (const [letter, value] of letterNames) {
    const count = Math.floor(number / value);

    if (count > 0) {
      letters.push(letter.repeat(count));
      breakdown.push(`${letter} (${value}) × ${count}`);
      number %= value;
    }
  }

  return {
    letters: letters.join(""),
    breakdown: breakdown.join(" + ")
  };
}

// تحويل عدة أرقام إلى حروف
function convertNumber() {
  const raw = document.getElementById("numberInput").value.trim();
  const result = document.getElementById("numberResult");

  if (!raw) {
    alert("يرجى إدخال رقم واحد على الأقل.");
    return;
  }

  const numbers = splitNumbers(raw);
  const parsed = [];

  // التحقق من جميع المدخلات قبل عرض النتائج
  for (const item of numbers) {
    if (!/^\d+$/.test(item)) {
      alert("يرجى كتابة أرقام صحيحة فقط وفصلها بفواصل.");
      return;
    }

    const number = Number(item);

    if (!Number.isSafeInteger(number) ||
        number < 1 || number > 1000000) {
      alert("كل رقم يجب أن يكون بين 1 و1,000,000.");
      return;
    }

    parsed.push(number);
  }

  let html = `
    <h3>نتائج تحويل الأرقام</h3>
    <table>
      <thead>
        <tr>
          <th>الرقم</th>
          <th>الحروف</th>
          <th>تفصيل القيم</th>
        </tr>
      </thead>
      <tbody>
  `;

  for (const number of parsed) {
    const converted = numberToLetters(number);

    html += `
      <tr>
        <td>${number}</td>
        <td style="font-size:21px;font-weight:bold">
          ${escapeHTML(converted.letters)}
        </td>
        <td>${escapeHTML(converted.breakdown)}</td>
      </tr>
    `;
  }

  html += `
      </tbody>
    </table>

    <button class="secondary-btn"
      onclick="copyNumberResults()">
      نسخ جميع النتائج
    </button>
  `;

  result.innerHTML = html;
  result.classList.remove("hidden");
}

// إعادة ضبط قسم الأسماء
function resetName() {
  document.getElementById("nameInput").value = "";

  const result = document.getElementById("nameResult");
  result.innerHTML = "";
  result.classList.add("hidden");

  window.lastNameResult = "";
}

// إعادة ضبط قسم الأرقام
function resetNumbers() {
  document.getElementById("numberInput").value = "";

  const result = document.getElementById("numberResult");
  result.innerHTML = "";
  result.classList.add("hidden");
}

// تجهيز جميع النتائج للنسخ
function copyNumberResults() {
  const raw = document.getElementById("numberInput").value.trim();
  const numbers = splitNumbers(raw);

  const text = numbers.map(item => {
    const number = Number(item);
    const converted = numberToLetters(number);

    return `${number} = ${converted.letters}\n` +
           `تفصيل القيم: ${converted.breakdown}`;
  }).join("\n\n");

  copyText(text);
}

function copyNameResult() {
  copyText(window.lastNameResult || "");
}

// نسخ النص مع دعم المتصفحات المختلفة
function copyText(text) {
  if (!text) {
    alert("لا توجد نتيجة لنسخها.");
    return;
  }

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(
      () => alert("تم نسخ النتيجة بنجاح."),
      () => fallbackCopy(text)
    );
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const area = document.createElement("textarea");
  area.value = text;
  area.style.position = "fixed";
  area.style.opacity = "0";

  document.body.appendChild(area);
  area.select();

  try {
    const success = document.execCommand("copy");
    alert(success
      ? "تم نسخ النتيجة بنجاح."
      : "تعذر النسخ، يرجى نسخ النتيجة يدويًا.");
  } catch (error) {
    alert("تعذر النسخ، يرجى نسخ النتيجة يدويًا.");
  }

  area.remove();
}

// حماية النصوص المدخلة عند عرضها في HTML
function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[ch]);
}
</script>
</body>
</html>
